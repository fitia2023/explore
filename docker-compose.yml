services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production 
      - DATABASE_URL=${DATABASE_URL:-file:./data/prod.db}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3